<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIDFB | Cases</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function switchLang(lang) {
      document.querySelectorAll('.lang-en').forEach(el => el.style.display = lang==='en'?'block':'none');
      document.querySelectorAll('.lang-ar').forEach(el => el.style.display = lang==='ar'?'block':'none');
    }
  </script>
</head>

<body>

<header>
  <h1>CIDFB</h1>
</header>

<div class="container">

  <aside class="sidebar">
    <a href="index.html" class="lang-en">Home</a>
    <a href="index.html" class="lang-ar">الرئيسية</a>
    <a class="active lang-en">Cases Dashboard</a>
    <a class="active lang-ar">لوحة القضايا</a>
  </aside>

  <main>

    <h2 class="lang-en">Investigation Cases</h2>
    <h2 class="lang-ar">قائمة القضايا</h2>

    <table>
      <tr>
        <th class="lang-en">Case ID</th>
        <th class="lang-ar">رقم القضية</th>
        <th class="lang-en">Entity</th>
        <th class="lang-ar">الجهة</th>
        <th class="lang-en">Crime Type</th>
        <th class="lang-ar">نوع الجريمة</th>
        <th class="lang-en">Status</th>
        <th class="lang-ar">الحالة</th>
      </tr>

      <tr>
        <td>CID-2025-DF-118</td>
        <td class="lang-en">FinCore Systems</td>
        <td class="lang-ar">أنظمة فينكور</td>
        <td class="lang-en">Financial Fraud</td>
        <td class="lang-ar">احتيال مالي</td>
        <td class="lang-en active-status">Active</td>
        <td class="lang-ar active-status">نشطة</td>
      </tr>
    </table>

    <div class="lang-switch">
      <button onclick="switchLang('en')">EN</button>
      <button onclick="switchLang('ar')">AR</button>
    </div>

  </main>
</div>

</body>
</html>
