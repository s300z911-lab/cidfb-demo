<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Digital Crime Incident Report</title>
  <link rel="stylesheet" href="style.css">

  <script>
    // تحديد اللغة الحالية
    let currentLang = 'en';

    function switchLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-en').forEach(el => el.style.display = lang==='en'?'block':'none');
      document.querySelectorAll('.lang-ar').forEach(el => el.style.display = lang==='ar'?'block':'none');
    }

    function validateForm() {
      const evidence = document.getElementById("evidence").files.length;
      const agree = document.getElementById("agreement").checked;

      if (evidence < 1) {
        if(currentLang==='en'){
          alert("At least one digital evidence file is required.");
        } else {
          alert("يجب رفع ملف واحد على الأقل من الأدلة الرقمية.");
        }
        return false;
      }

      if (!agree) {
        if(currentLang==='en'){
          alert("You must agree to the legal declaration before submitting. Failing to do so may result in legal consequences.");
        } else {
          alert("يجب الموافقة على التصريح القانوني قبل الإرسال. عدم الموافقة أو تقديم معلومات غير صحيحة قد يؤدي إلى مساءلة قانونية.");
        }
        return false;
      }

      if(currentLang==='en'){
        alert("Incident submitted successfully (Simulation).");
      } else {
        alert("تم إرسال البلاغ بنجاح (محاكاة).");
      }

      return true;
    }
  </script>
</head>

<body>

<header>
  <h1>CIDFB</h1>
  <span>Cyber Forensics & Advanced Digital Investigation Bureau</span>
</header>

<div class="container">

  <aside class="sidebar">
    <a href="index.html">Home</a>
    <a href="dashbord.html">Cases Dashboard</a>
    <a href="case.html">Active Investigation</a>
    <a class="active">Incident Report</a>
    <a href="archive.html">Closed Cases</a>
  </aside>

  <main>
    <h2 class="lang-en">Digital Crime Incident Report</h2>
    <h2 class="lang-ar">نموذج تقرير حادثة الجرائم الرقمية</h2>

    <form onsubmit="return validateForm()">

      <!-- Crime Information -->
      <label class="lang-en">Type of Digital Crime *</label>
      <label class="lang-ar">نوع الجريمة الرقمية *</label>
      <select required>
        <option value="">Select</option>
        <option>Account Compromise</option>
        <option>Financial Fraud</option>
        <option>Cyber Blackmail</option>
        <option>Data Breach</option>
        <option>Identity Impersonation</option>
      </select>

      <label class="lang-en">Date & Time of Incident *</label>
      <label class="lang-ar">تاريخ ووقت الحادث *</label>
      <input type="datetime-local" required>

      <label class="lang-en">Is the incident ongoing? *</label>
      <label class="lang-ar">هل الحادث مستمر؟ *</label>
      <select required>
        <option value="">Select</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label class="lang-en">Affected Platform / System *</label>
      <label class="lang-ar">المنصة / النظام المتأثر *</label>
      <input type="text" placeholder="Website, App, Email, Account" required>

      <!-- Victim Information -->
      <label class="lang-en">Reporter Role *</label>
      <label class="lang-ar">دور المبلغ *</label>
      <select required>
        <option value="">Select</option>
        <option>Victim</option>
        <option>Legal Representative</option>
        <option>Technical Entity</option>
      </select>

      <label class="lang-en">Victim / Entity Name *</label>
      <label class="lang-ar">اسم الضحية / الجهة *</label>
      <input type="text" required>

      <label class="lang-en">Official Contact (Email or Phone) *</label>
      <label class="lang-ar">جهة الاتصال الرسمية (البريد الإلكتروني أو الهاتف) *</label>
      <input type="text" required>

      <!-- Technical Details -->
      <label class="lang-en">Incident Description *</label>
      <label class="lang-ar">وصف الحادث *</label>
      <textarea rows="5" maxlength="500" placeholder="Provide a factual description of the incident" required></textarea>

      <label class="lang-en">Date of First Suspicious Activity *</label>
      <label class="lang-ar">تاريخ أول نشاط مشبوه *</label>
      <input type="date" required>

      <label class="lang-en">Date of Last Suspicious Activity *</label>
      <label class="lang-ar">تاريخ آخر نشاط مشبوه *</label>
      <input type="date" required>

      <!-- Evidence -->
      <label class="lang-en">Upload Digital Evidence (at least one file) *</label>
      <label class="lang-ar">رفع الأدلة الرقمية (ملف واحد على الأقل) *</label>
      <input type="file" id="evidence" multiple>

      <label class="lang-en">Evidence Description *</label>
      <label class="lang-ar">وصف الأدلة *</label>
      <textarea rows="3" placeholder="When and how the evidence was obtained" required></textarea>

      <!-- Optional Section -->
      <label class="lang-en">Estimated Impact Level</label>
      <label class="lang-ar">تقدير مستوى التأثير</label>
      <select>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
        <option>Critical</option>
      </select>

      <label class="lang-en">Financial Loss (if any)</label>
      <label class="lang-ar">الخسارة المالية (إن وجدت)</label>
      <input type="text" placeholder="Approximate amount">

      <!-- Legal Declaration -->
      <div class="checkbox-group">
        <label class="lang-en">
          <input type="checkbox" id="agreement">
          I hereby declare that all provided information is accurate, truthful, and complete. Any false statement, omission, or misrepresentation may result in legal consequences, including fines or criminal charges.
        </label>
        <label class="lang-ar">
          <input type="checkbox" id="agreement">
          أقر بموجب هذا أن جميع المعلومات المقدمة دقيقة وصحيحة وكاملة. أي تصريح خاطئ، أو حذف معلومات، أو تحريف للحقائق قد يؤدي إلى مساءلة قانونية، بما في ذلك الغرامات أو الملاحقة الجنائية.
        </label>
      </div>

      <label class="lang-en">Full Name *</label>
      <label class="lang-ar">الاسم الكامل *</label>
      <input type="text" required>

      <button type="submit" class="lang-en">Submit Incident</button>
      <button type="submit" class="lang-ar">إرسال البلاغ</button>

    </form>

    <div class="lang-switch">
      <button onclick="switchLang('en')">EN</button>
      <button onclick="switchLang('ar')">AR</button>
    </div>

  </main>
</div>

</body>
</html>
