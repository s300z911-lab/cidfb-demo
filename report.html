<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Crime Incident Report</title>
  <link rel="stylesheet" href="style.css">

  <script>
    function switchLang(lang) {
      document.querySelectorAll('.lang-en').forEach(el => el.style.display = lang==='en'?'block':'none');
      document.querySelectorAll('.lang-ar').forEach(el => el.style.display = lang==='ar'?'block':'none');
    function validateForm() {
  const evidence = document.getElementById("evidence").files.length;
  const agree = document.getElementById("agreement").checked;

  // نحدد اللغة حسب أي نسخة معروضة
  const lang = document.querySelector('.lang-ar').style.display === 'block' ? 'ar' : 'en';

  if (evidence < 1) {
    alert(lang === 'ar' 
      ? "يجب تحميل ملف/ملفات دليل رقمي على الأقل." 
      : "At least one digital evidence file is required.");
    return false;
  }

  if (!agree) {
    alert(lang === 'ar' 
      ? "يجب الموافقة على التصريح القانوني قبل إرسال البلاغ، وفي حالة تقديم معلومات خاطئة تتحمل المسؤولية القانونية." 
      : "You must agree to the legal declaration; providing false information may result in legal consequences.");
    return false;
  }

  alert(lang === 'ar' 
    ? "تم إرسال البلاغ بنجاح." 
    : "Incident submitted successfully (Simulation).");
  return true;
}
  </script>
</head>

<body>

<header>
  <h1>CIDFB</h1>
  <span class="lang-en">Cyber Forensics & Advanced Digital Investigation Bureau</span>
  <span class="lang-ar">مكتب التحقيق المتقدم والأدلة الجنائية الرقمية</span>
</header>

<div class="container">

  <aside class="sidebar">
    <a href="index.html">Home</a>
    <a href="dashbord.html">Cases Dashboard</a>
    <a href="case.html">Active Investigation</a>
    <a class="active">Incident Report</a>
    <a href="archive.html">Closed Cases</a>
  </aside>

  <main>

    <h2 class="lang-en">Digital Crime Incident Report</h2>
    <h2 class="lang-ar">بلاغ جريمة رقمية</h2>

    <form onsubmit="return validateForm()">

      <!-- Crime Information -->
      <label class="lang-en">Type of Digital Crime *</label>
      <label class="lang-ar">نوع الجريمة الرقمية *</label>
      <select required>
        <option value="">Select</option>
        <option class="lang-en">Account Compromise</option>
        <option class="lang-ar">اختراق حساب</option>
        <option class="lang-en">Financial Fraud</option>
        <option class="lang-ar">احتيال مالي</option>
        <option class="lang-en">Cyber Blackmail</option>
        <option class="lang-ar">ابتزاز إلكتروني</option>
        <option class="lang-en">Data Breach</option>
        <option class="lang-ar">اختراق بيانات</option>
        <option class="lang-en">Identity Impersonation</option>
        <option class="lang-ar">انتحال هوية</option>
      </select>

      <label class="lang-en">Date & Time of Incident *</label>
      <label class="lang-ar">تاريخ ووقت الحادثة *</label>
      <input type="datetime-local" required>

      <label class="lang-en">Is the incident ongoing? *</label>
      <label class="lang-ar">هل الحادثة مستمرة؟ *</label>
      <select required>
        <option class="lang-en">Yes</option>
        <option class="lang-ar">نعم</option>
        <option class="lang-en">No</option>
        <option class="lang-ar">لا</option>
      </select>

      <label class="lang-en">Affected Platform / System *</label>
      <label class="lang-ar">المنصة أو النظام المتأثر *</label>
      <input type="text" required>

      <!-- Victim Information -->
      <label class="lang-en">Reporter Role *</label>
      <label class="lang-ar">صفة المبلّغ *</label>
      <select required>
        <option class="lang-en">Victim</option>
        <option class="lang-ar">الضحية</option>
        <option class="lang-en">Legal Representative</option>
        <option class="lang-ar">ممثل قانوني</option>
        <option class="lang-en">Technical Entity</option>
        <option class="lang-ar">جهة تقنية</option>
      </select>

      <label class="lang-en">Victim / Entity Name *</label>
      <label class="lang-ar">اسم الضحية / الجهة *</label>
      <input type="text" required>

      <label class="lang-en">Official Contact *</label>
      <label class="lang-ar">وسيلة التواصل الرسمية *</label>
      <input type="text" required>

      <label class="lang-en">Incident Description *</label>
      <label class="lang-ar">وصف الحادثة *</label>
      <textarea rows="5" required></textarea>

      <label class="lang-en">Upload Digital Evidence *</label>
      <label class="lang-ar">رفع الأدلة الرقمية *</label>
      <input type="file" id="evidence" multiple>

      <div class="checkbox-group">
        <label class="lang-en">
          <input type="checkbox" id="agreement">
        I hereby declare that all information provided in this incident report is true, complete, and accurate to the best of my knowledge. I acknowledge that any false, misleading, or incomplete information may result in legal liability and accountability in accordance with applicable laws and regulations.
        </label>
        <label class="lang-ar">
          <input type="checkbox">
         أقر بموجبه أن جميع المعلومات المقدمة في هذا التقرير دقيقة وكاملة وصحيحة حسب علمي. وأقر بأن أي معلومات خاطئة أو مضللة أو ناقصة قد تؤدي إلى المسؤولية القانونية والمحاسبة وفقًا للقوانين والأنظمة المعمول بها.
        </label>
      </div>

      <button type="submit" class="lang-en">Submit Incident</button>
      <button type="submit" class="lang-ar">إرسال البلاغ</button>

    </form>

    <div class="lang-switch">
      <button onclick="switchLang('en')">EN</button>
      <button onclick="switchLang('ar')">AR</button>
    </div>

  </main>
</div>

</body>
</html>
