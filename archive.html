<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closed Cases</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function switchLang(lang) {
      document.querySelectorAll('.lang-en').forEach(el => el.style.display = lang==='en'?'block':'none');
      document.querySelectorAll('.lang-ar').forEach(el => el.style.display = lang==='ar'?'block':'none');
    }
  </script>
</head>

<body>

<header>
  <h1>CIDFB</h1>
</header>

<main>

  <h2 class="lang-en">Archived Cases</h2>
  <h2 class="lang-ar">القضايا المغلقة</h2>

  <ul>
    <li class="lang-en">Credential Compromise</li>
    <li class="lang-ar">اختراق بيانات اعتماد</li>
    <li class="lang-en">Payment Gateway Breach</li>
    <li class="lang-ar">اختراق بوابة دفع</li>
  </ul>

  <div class="lang-switch">
    <button onclick="switchLang('en')">EN</button>
    <button onclick="switchLang('ar')">AR</button>
  </div>

</main>

</body>
</html>
